name: Publish flashcards
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: memory-67-hosting
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/411496341991/locations/global/workloadIdentityPools/flashcards/providers/github
          service_account: flashcards-hosting@memory-67.iam.gserviceaccount.com
      - name: Publish to Firebase Hosting
        run: npx --yes firebase-tools@15.35.0 deploy --only hosting --project memory-67 --non-interactive
